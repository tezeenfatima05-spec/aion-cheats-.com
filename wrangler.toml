# Must match Cloudflare Workers Builds project name (CI overrides mismatched names).
name = "aion-cheats--com"
main = "scripts/worker.mjs"
compatibility_date = "2024-11-08"
workers_dev = true

# Runs automatically before `wrangler deploy` (Cloudflare CI often only invokes deploy).
[build]
command = "node scripts/wrangler-build.mjs"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

# zone_name required when the account uses SSL for SaaS (API error 10082).
[[routes]]
pattern = "aion-cheats.com"
custom_domain = true
zone_name = "aion-cheats.com"

[[routes]]
pattern = "www.aion-cheats.com"
custom_domain = true
zone_name = "aion-cheats.com"
