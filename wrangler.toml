# Cloudflare Workers static assets (output in dist/).
name = "aion-cheats-com"
main = "scripts/worker.mjs"
compatibility_date = "2024-11-08"
workers_dev = true

# Runs automatically before `wrangler deploy` (Cloudflare CI often only invokes deploy).
[build]
command = "node scripts/wrangler-build.mjs"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

# Custom domain must match this Worker or aion-cheats.com serves a stale asset bundle.
[[routes]]
pattern = "aion-cheats.com"
custom_domain = true

[[routes]]
pattern = "www.aion-cheats.com"
custom_domain = true
