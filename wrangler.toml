# Workers Builds → Deploy command: `node scripts/wrangler-deploy-cf.mjs`
name = "aion-cheats--com"
main = "scripts/worker.mjs"
compatibility_date = "2024-11-08"
workers_dev = true
preview_urls = false

[build]
command = "node scripts/wrangler-build.mjs"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

# No routes here — aion-cheats.com is not attached to this Worker (workers.dev preview only).
