# Cloudflare Workers static assets (output in dist/).
name = "aion-cheats-com"
compatibility_date = "2024-11-08"

# Runs automatically before `wrangler deploy` (Cloudflare CI often only invokes deploy).
[build]
command = "PUBLIC_SITE_URL=https://aion-cheats--com.tazeenrooziroti.workers.dev npm run build"

[assets]
directory = "./dist"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
